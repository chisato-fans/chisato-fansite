<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ニュース | 小林千悟くんfansite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FCF6EA;
    --bg-raised: #FFFFF5;
    --line: rgba(0,0,0,0.09);
    --line-strong: rgba(0,0,0,0.18);
    --text: #2B2A2C;
    --text-dim: #67656C;
    --text-faint: #94929A;
    --spot: #7A9A2E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans JP", sans-serif;
    font-weight:300;
    line-height:1.8;
  }
  h1,h2,h3,.display{
    font-family:"Oswald","Noto Sans JP",sans-serif;
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-weight:600;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:960px; margin:0 auto; padding:0 24px;}
  img{display:block; width:100%; height:auto;}

  /* header (shared with top page) */
  header{
    position:sticky; top:0; z-index:50;
    border-bottom:1px solid var(--line);
  }
  header::before{
    content:""; position:absolute; inset:0; z-index:-1;
    background:rgba(252,246,234,0.88);
    backdrop-filter:blur(6px);
  }
  header .wrap{
    display:flex; align-items:center; justify-content:space-between;
    height:64px;
  }
  .header-right{display:flex; align-items:center; gap:20px;}
  .logo{font-family:"Oswald",sans-serif; font-size:18px; letter-spacing:0.12em; font-weight:600;}
  nav{display:flex; gap:28px; font-size:13px; letter-spacing:0.05em; color:var(--text-dim);}
  nav a:hover{color:var(--spot);}
  .nav-toggle{display:none; background:none; border:none; color:var(--text); font-size:22px; cursor:pointer;}

  @media (max-width: 720px){
    nav{
      position:fixed; top:64px; left:0; right:0; bottom:0;
      background:rgba(20,20,22,0.6); flex-direction:column; padding:28px 24px; gap:0;
      transform:translateX(100%); transition:transform 0.25s ease;
    }
    nav.open{transform:translateX(0);}
    nav a{padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.18); font-size:16px; color:#fff;}
    .nav-toggle{display:block;}
  }

  /* mobile preview mode (shared with top page) */
  .preview-overlay{
    display:none; position:fixed; inset:0; z-index:300;
    background:rgba(20,20,22,0.92);
    align-items:center; justify-content:center;
    flex-direction:column; gap:16px;
  }
  .preview-overlay.open{display:flex;}
  .preview-frame-wrap{
    width:390px; height:min(844px, 88vh);
    border-radius:36px; overflow:hidden;
    box-shadow:0 30px 70px rgba(0,0,0,0.6), 0 0 0 8px #111;
    background:#fff;
  }
  .preview-frame-wrap iframe{width:100%; height:100%; border:none; display:block;}
  .preview-close{
    background:none; border:1px solid rgba(255,255,255,0.3); color:#fff;
    border-radius:20px; padding:8px 18px; font-size:13px;
    font-family:"Noto Sans JP", sans-serif; cursor:pointer;
  }
  .preview-close:hover{border-color:#fff;}
  .preview-btn{
    display:flex; align-items:center; gap:7px;
    background:transparent; color:var(--text-dim);
    border:1px solid var(--line-strong); border-radius:20px; padding:8px 14px 8px 12px;
    font-family:"Noto Sans JP", sans-serif; font-size:12px; font-weight:500;
    cursor:pointer; transition:border-color 0.15s ease, color 0.15s ease;
  }
  .preview-btn:hover{border-color:var(--spot); color:var(--spot);}
  .preview-btn svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.6;}
  @media (max-width:720px){
    .preview-btn span{display:none;}
    .preview-btn{padding:8px; border-radius:50%;}
  }

  /* footer (shared with top page) */
  footer{border-top:1px solid var(--line); padding:36px 0; }
  footer .wrap{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;}
  footer p{font-size:12px; color:var(--text-faint);}
  footer .social{display:flex; gap:16px; font-size:12px; color:var(--text-dim);}
  footer .social a:hover{color:var(--spot);}

  /* page content */
  .page-head{padding:56px 0 32px;}
  .page-head .eyebrow{
    font-size:12px; letter-spacing:0.25em; color:var(--spot); margin-bottom:14px;
  }
  .page-head h1{
    font-size:clamp(26px, 5vw, 40px);
    line-height:1.3;
  }
  main{padding-bottom:96px;}
  .feed-card{
    max-width:640px; margin:0 auto;
    background:var(--bg-raised); border:1px solid var(--line);
    border-radius:2px; padding:8px 24px;
  }
  .news-item{padding:16px 0; border-bottom:1px solid var(--line);}
  .news-item:last-child{border-bottom:none;}
  .news-item .date{font-size:11px; color:var(--text-faint); letter-spacing:0.05em;}
  .news-item p{font-size:15px; margin-top:6px; font-weight:400;}
  .feed-empty{font-size:13px; color:var(--text-faint); padding:24px 0; text-align:center;}
</style>
</head>
<body>

<div class="preview-overlay" id="previewOverlay">
  <div class="preview-frame-wrap">
    <iframe id="previewFrame" title="スマホプレビュー"></iframe>
  </div>
  <button class="preview-close" id="previewClose">閉じる ✕</button>
</div>

<header>
  <div class="wrap">
    <a href="../fansite.html" class="logo">小林千悟くんfansite</a>
    <div class="header-right">
      <nav id="nav">
        <a href="../fansite.html#news">ニュース</a>
        <a href="../fansite.html#profile">プロフィール</a>
        <a href="../fansite.html#history">出演履歴</a>
        <a href="../fansite.html#gallery">ギャラリー</a>
      </nav>
      <button class="preview-btn" id="previewBtn">
        <svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><line x1="11" y1="18.3" x2="13" y2="18.3"/></svg>
        <span>スマホプレビュー</span>
      </button>
      <button class="nav-toggle" id="navToggle" aria-label="メニューを開く">☰</button>
    </div>
  </div>
</header>

<section class="page-head">
  <div class="wrap">
    <p class="eyebrow">NEWS</p>
    <h1>ニュース</h1>
  </div>
</section>

<main>
  <div class="wrap">
    <div class="feed-card" id="newsFeed"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <p>©小林千悟くん応援有志 This is an unofficial fan site.</p>
    <div class="social"><a href="https://x.com/chisato_fans" target="_blank" rel="noopener">X</a><a href="https://instagram.com/chisato_fans" target="_blank" rel="noopener">Instagram</a><a href="https://t.co/39vQ7f3cYx" target="_blank" rel="noopener">LINEオープンチャット</a></div>
  </div>
</footer>

<script>
  // 小林千悟くんfansite - ニュースデータ（fansite.html / pages/news.html と同期）
  const newsData = [
    { date: "2026.08.15", title: "ファンサイトを公開しました。" }
  ];

  const feed = document.getElementById('newsFeed');
  if(typeof newsData !== 'undefined' && newsData.length){
    feed.innerHTML = newsData.map(item =>
      `<div class="news-item"><span class="date">${item.date}</span><p>${item.title}</p></div>`
    ).join('');
  }else{
    feed.innerHTML = '<p class="feed-empty">現在お知らせはありません。</p>';
  }

  const previewBtn = document.getElementById('previewBtn');
  const previewOverlay = document.getElementById('previewOverlay');
  const previewFrame = document.getElementById('previewFrame');
  const previewClose = document.getElementById('previewClose');

  previewBtn.addEventListener('click', () => {
    if(!previewFrame.src){ previewFrame.src = location.href; }
    previewOverlay.classList.add('open');
  });
  previewClose.addEventListener('click', () => previewOverlay.classList.remove('open'));
  previewOverlay.addEventListener('click', (e) => {
    if(e.target === previewOverlay) previewOverlay.classList.remove('open');
  });
  if(window.self !== window.top){ previewBtn.style.display = 'none'; }

  const toggle = document.getElementById('navToggle');
  const nav = document.getElementById('nav');
  toggle.addEventListener('click', () => nav.classList.toggle('open'));
  nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => nav.classList.remove('open')));
</script>

</body>
</html>
