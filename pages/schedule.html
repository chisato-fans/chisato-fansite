<title>応援スケジュール | 小林千悟くんfansite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --bg: #FCF6EA;
    --bg-raised: #FFFFF5;
    --line: rgba(0,0,0,0.09);
    --line-strong: rgba(0,0,0,0.18);
    --text: #2B2A2C;
    --text-dim: #67656C;
    --text-faint: #94929A;
    --spot: #7A9A2E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans JP", sans-serif;
    font-weight:300;
    line-height:1.8;
  }
  h1,h2,h3,.display{
    font-family:"Oswald","Noto Sans JP",sans-serif;
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-weight:600;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:960px; margin:0 auto; padding:0 24px;}
  img{display:block; width:100%; height:auto;}

  /* header (shared with top page) */
  header{
    position:sticky; top:0; z-index:50;
    border-bottom:1px solid var(--line);
  }
  header::before{
    content:""; position:absolute; inset:0; z-index:-1;
    background:rgba(252,246,234,0.88);
    backdrop-filter:blur(6px);
  }
  header .wrap{
    display:flex; align-items:center; justify-content:space-between;
    height:64px;
  }
  .header-right{display:flex; align-items:center; gap:20px;}
  .logo{font-family:"Oswald",sans-serif; font-size:18px; letter-spacing:0.12em; font-weight:600;}
  nav{display:flex; gap:28px; font-size:13px; letter-spacing:0.05em; color:var(--text-dim);}
  nav a:hover{color:var(--spot);}
  .nav-toggle{display:none; background:none; border:none; color:var(--text); font-size:22px; cursor:pointer;}

  @media (max-width: 720px){
    nav{
      position:fixed; top:64px; left:0; right:0; bottom:0;
      background:rgba(20,20,22,0.6); flex-direction:column; padding:28px 24px; gap:0;
      transform:translateX(100%); transition:transform 0.25s ease;
    }
    nav.open{transform:translateX(0);}
    nav a{padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.18); font-size:16px; color:#fff;}
    .nav-toggle{display:block;}
  }


  /* footer (shared with top page) */
  footer{border-top:1px solid var(--line); padding:36px 0; }
  footer .wrap{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;}
  footer p{font-size:12px; color:var(--text-faint);}
  footer .social{display:flex; gap:16px; font-size:12px; color:var(--text-dim);}
  footer .social a:hover{color:var(--spot);}

  /* page content */
  .page-head{padding:56px 0 32px;}
  .page-head .eyebrow{
    font-size:12px; letter-spacing:0.25em; color:var(--spot); margin-bottom:14px;
  }
  .page-head h1{
    font-size:clamp(26px, 5vw, 40px);
    line-height:1.3;
  }
  main{padding-bottom:96px;}
  .feed-card{
    max-width:640px; margin:0 auto;
    background:var(--bg-raised); border:1px solid var(--line);
    border-radius:2px; padding:8px 24px;
  }
  .sched-item{display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); align-items:baseline;}
  .sched-item:last-child{border-bottom:none;}
  .sched-item .d{font-size:14px; color:var(--spot); min-width:58px; font-family:"Oswald",sans-serif;}
  .sched-item .t{font-size:15px;}
  .feed-empty{font-size:13px; color:var(--text-faint); padding:24px 0; text-align:center;}
</style>
</head>
<body>


<header>
  <div class="wrap">
    <a href="../index.html" class="logo">小林千悟くんfansite</a>
    <div class="header-right">
      <nav id="nav">
        <a href="../index.html#news">ニュース</a>
        <a href="../index.html#profile">プロフィール</a>

    </div>
  </div>
</header>

<section class="page-head">
  <div class="wrap">
    <p class="eyebrow">SCHEDULE</p>
    <h1>応援スケジュール</h1>

<main>

  </div>
</main>

<footer>
  <div class="wrap">
    <p>©小林千悟くん応援有志 This is an unofficial fan site.</p>

  </div>
</footer>

<script>
  // 小林千悟くんfansite - 応援スケジュールデータ（fansite.html / pages/schedule.html と同期）
  const scheduleData = [
    { date: "09.10", title: "第3回ちさとにありがとうの日" },
    { date: "09.05", title: "イベント出演記念タグイベント" },
    { date: "09.03-04", title: "動画再生＆コメントパーティー ～語るほど高鳴る鼓動LOUD1組～" },
    { date: "08.25-26", title: "動画再生＆コメントパーティー" },
    { date: "08.24～", title: "ファンブック感想企画" },
    { date: "08.23", title: "月例ちぃサミット" },
    { date: "08.20", title: "実に暑い 夏のチサトラベル" },
    { date: "08.12-13", title: "動画再生＆コメントパーティー" },
    { date: "08.10", title: "第2回 ちさとにありがとうの日" },
    { date: "08.08", title: "世界ねこの日 ちさりきにゃんこDAY" },

    { date: "07.07", title: "七夕タグイベント" }
  ];

  const feed = document.getElementById('scheduleFeed');
  if(typeof scheduleData !== 'undefined' && scheduleData.length){
    feed.innerHTML = scheduleData.map(item =>
      `<div class="sched-item"><span class="d">${item.date}</span><span class="t">${item.title}</span></div>`
    ).join('');
  }else{
    feed.innerHTML = '<p class="feed-empty">現在予定されているスケジュールはありません。</p>';
  }


  const toggle = document.getElementById('navToggle');
  const nav = document.getElementById('nav');
  toggle.addEventListener('click', () => nav.classList.toggle('open'));
  nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => nav.classList.remove('open')));
</script>
